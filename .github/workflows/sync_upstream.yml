name: Sync Upstream & Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      build_ios:
        description: "Trigger iOS IPA build after syncing"
        required: false
        default: true
        type: boolean
      bundle_id:
        description: "iOS Bundle Identifier (match P12 certificate)"
        required: false
        default: "com.example.piliplus"
        type: string
  schedule:
    # Daily check at 04:00 UTC (12:00 CST). Since 2026-10-22: builds happen only when upstream ships a new release.
    - cron: "0 4 * * *"

permissions:
  contents: write
  actions: write

jobs:
  sync:
    name: Sync with Upstream (bggRGjQaUbCoE/PiliPlus)
    runs-on: ubuntu-latest
    outputs:
      has_updates: ${{ steps.merge.outputs.has_updates }}
      should_build: ${{ steps.merge.outputs.should_build }}
      release_tag: ${{ steps.merge.outputs.release_tag }}
    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge Upstream / Check Release
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/bggRGjQaUbCoE/PiliPlus.git || true
          git fetch upstream main --tags
          git fetch origin --tags || true

          # Manual dispatch keeps the previous behavior: merge latest upstream main, build on request.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "release_tag=manual" >> $GITHUB_OUTPUT
            if [[ "${{ inputs.build_ios }}" != "true" ]]; then
              echo "Manual dispatch with build_ios=false: nothing to do."
              echo "has_updates=false" >> $GITHUB_OUTPUT
              echo "should_build=false" >> $GITHUB_OUTPUT
              exit 0
            fi
            LOCAL_HEAD=$(git rev-parse HEAD)
            UPSTREAM_HEAD=$(git rev-parse upstream/main)
            if git merge-base --is-ancestor "$UPSTREAM_HEAD" "$LOCAL_HEAD"; then
              echo "Already up-to-date with upstream/main; building current HEAD (manual)."
              echo "has_updates=false" >> $GITHUB_OUTPUT
            else
              echo "Merging new commits from upstream/main..."
              git merge upstream/main -m "chore: sync upstream bggRGjQaUbCoE/PiliPlus main" || {
                echo "Resolving merge conflicts by favoring our iOS 27 fix changes (-X ours)..."
                git merge --abort || true
                git merge -X ours upstream/main -m "chore: sync upstream bggRGjQaUbCoE/PiliPlus main (keep iOS 27 fixes)"
              }
              git push origin main
              echo "has_updates=true" >> $GITHUB_OUTPUT
            fi
            echo "should_build=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Scheduled run: release-only builds (user decision 2026-10-22).
          LATEST_TAG=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/bggRGjQaUbCoE/PiliPlus/releases/latest | jq -r '.tag_name')
          if [[ -z "$LATEST_TAG" || "$LATEST_TAG" == "null" ]]; then
            echo "Could not determine latest upstream release; skipping this run."
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "release_tag=" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "Latest upstream release: $LATEST_TAG"
          echo "release_tag=$LATEST_TAG" >> $GITHUB_OUTPUT

          if git rev-parse -q --verify "refs/tags/ipa-built-$LATEST_TAG" > /dev/null; then
            echo "Release $LATEST_TAG was already built (fork tag ipa-built-$LATEST_TAG exists). Skipping."
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "should_build=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "New upstream release $LATEST_TAG: merging the release tag and building."
          git merge "$LATEST_TAG" -m "chore: sync upstream release $LATEST_TAG" || {
            echo "Resolving merge conflicts by favoring our iOS 27 fix changes (-X ours)..."
            git merge --abort || true
            git merge -X ours "$LATEST_TAG" -m "chore: sync upstream release $LATEST_TAG (keep iOS 27 fixes)"
          }
          git push origin main
          echo "has_updates=true" >> $GITHUB_OUTPUT
          echo "should_build=true" >> $GITHUB_OUTPUT
  build-ios:
    needs: sync
    if: ${{ needs.sync.outputs.should_build == 'true' }}
    uses: ./.github/workflows/ios.yml
    with:
      bundle_id: ${{ inputs.bundle_id || 'com.example.piliplus' }}

  mark-built:
    name: Mark Release as Built
    needs: [sync, build-ios]
    if: ${{ needs.sync.outputs.release_tag != '' && needs.sync.outputs.release_tag != 'manual' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag built release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "ipa-built-${{ needs.sync.outputs.release_tag }}"
          git push origin "ipa-built-${{ needs.sync.outputs.release_tag }}"
